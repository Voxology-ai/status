name: Update Template CI
permissions:
  contents: write
  issues: write
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update template
        uses: upptime/uptime-monitor@master
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
      - name: Restore required workflow permissions
        run: |
          python3 scripts/patch-upptime-workflow-permissions.py
          if ! git diff --quiet -- .github/workflows; then
            git config user.name "Upptime Bot"
            git config user.email "73812536+upptime-bot@users.noreply.github.com"
            git add .github/workflows
            git commit -m ":wrench: Preserve workflow permissions [skip ci]"
            git push
          fi
